 .standalone-report{margin:25px auto;max-height:none!important;background:#fff;border-radius:18px;box-shadow:0 8px 50px #293c5810;display:flex;flex-direction:column;overflow:hidden}.standalone-report>header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:20px;border-bottom:1px solid #e5eaf1;margin-bottom:22px}.standalone-report h1{font-size:26px;letter-spacing:-.7px;margin:0}.standalone-report>header>div{display:flex;align-items:center;gap:12px}.standalone-report #reportView{flex:1;min-height:0;overflow:auto}.standalone-report .classroom-inspect{max-height:calc(92dvh - 180px)}.standalone-report .classroom-inspect header button{display:grid;place-items:center}.standalone-report .classroom-inspect header svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}@media(max-width:700px){.standalone-report{margin:12px auto}.standalone-report>header{align-items:flex-start;gap:12px}.standalone-report>header>div{flex-wrap:wrap;justify-content:flex-end}.standalone-report h1{font-size:23px}.standalone-report #printReport{font-size:12px;padding:9px 11px}}@media print{body{background:#fff}.standalone-report{height:auto!important;width:100%!important;margin:0;box-shadow:none;overflow:visible!important}.standalone-report #printReport,.classroom-inspect header button{display:none}.standalone-report .classroom-inspect{overflow:visible;max-height:none}.classroom-space.with-inspector{grid-template-columns:1fr}.classroom-map.progress-team-grid{grid-template-columns:repeat(3,1fr)!important}.classroom-inspect{border:0;padding:25px 0 0}.knowledge-task{break-inside:avoid}.classroom-group{break-inside:avoid}}</style></head><body><main class="knowledge-modal spatial-dashboard standalone-report"><header><h1>Knowledge report</h1><div><span id="exampleLabel" class="monitor-example"></span><button id="printReport">Print / Save PDF</button></div></header><div id="reportView"></div></main><script id="reportData" type="application/json">"__COLLABCANVAS_REPORT__"</script><script>
const data=JSON.parse(document.querySelector('#reportData').textContent),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cleanName=n=>(n||'Learner').replace(' (example)',''),knowledgeLabels={'demonstrated':'Demonstrated','needs-support':'Needs support','needs-check':'To review','not-observed':'No record'};
/* Pure visual group map. A dot represents a learner, never an inferred mastery score. */
const classroomSymbols={attention:'!',review:'…',recorded:'✓',empty:'–'};
function classroomInitial(name){return (name||'?').trim().slice(0,1).toUpperCase()}
function classroomLegend(knowledge=false){return '<div class="classroom-legend" aria-label="Status legend">'+[['attention',knowledge?'Needs support':'Needs attention'],['review','To review'],['recorded',knowledge?'Task evidence':'Work shared'],['empty','No record']].map(([state,label])=>'<span><i class="classroom-symbol '+state+'" aria-hidden="true">'+classroomSymbols[state]+'</i>'+label+'</span>').join('')+'</div>'}
function classroomMapHTML(people,groups,selected='',knowledge=false){
 return '<div class="classroom-map progress-team-grid" aria-label="Classroom groups">'+groups.map(g=>{const members=people.filter(p=>p.group===g.group);return '<article class="classroom-group '+(g.attention?'has-attention':'')+'" data-classroom-group="'+g.group+'"><header><button class="classroom-group-name" data-progress-team="'+g.group+'">Team '+(g.group+1)+'</button>'+(g.attention?'<span class="classroom-group-status attention" aria-label="'+g.attention+(knowledge?(g.attention===1?' learner needs support':' learners need support'):(g.attention===1?' rule needs attention':' rules need attention'))+'"><i aria-hidden="true">!</i>'+g.attention+'</span>':g.review?'<span class="classroom-group-status review" aria-label="'+g.review+(knowledge?(g.review===1?' learner record needs review':' learner records need review'):(g.review===1?' change needs review':' changes need review'))+'"><i aria-hidden="true">…</i>'+g.review+'</span>':'')+'</header><div class="classroom-members members-'+members.length+'">'+members.map(p=>'<button class="classroom-member '+p.state+(selected===p.id?' selected':'')+'" data-map-person="'+esc(p.id)+'" '+(knowledge?'data-knowledge-person="'+esc(p.id)+'"':'')+' aria-pressed="'+(selected===p.id)+'" aria-label="'+esc(p.name+' · '+p.role+' · '+p.stateLabel)+'" title="'+esc(p.role+' · '+p.stateLabel)+'"><span class="classroom-person-dot"><span>'+esc(classroomInitial(p.name))+'</span><i class="classroom-symbol '+p.state+'" aria-hidden="true">'+classroomSymbols[p.state]+'</i></span><span class="classroom-person-name">'+esc(p.name)+'</span></button>').join('')+'</div><footer>'+(g.footer||'')+'</footer></article>'}).join('')+'</div>';
}

function knowledgeTaskHTML(t,readOnly){
 const evidence=t.evidence.filter(e=>!t.review||e.scope!=='review');
 return '<details class="knowledge-task" data-knowledge-task="'+esc(t.id)+'"><summary><h3>'+esc(t.title)+'</h3><span class="knowledge-badge '+t.status+'">'+knowledgeLabels[t.status]+'</span></summary><div class="knowledge-task-detail">'+evidence.map(e=>'<blockquote><p>'+esc(e.text)+'</p>'+(e.reason?'<p class="knowledge-reason">'+esc(e.reason.replace(/^Example: /,''))+'</p>':'')+'</blockquote>').join('')+(!evidence.length?'<p>No saved answer.</p>':'')+(t.review?'<div class="knowledge-flat-note"><b>'+(t.reviewStale?'Review needs updating':'Teacher note')+'</b><p>'+esc(t.review.note)+'</p></div>':'')+'<div class="knowledge-flat-next"><b>Next</b><p>'+esc(t.nextCheck)+'</p></div>'+(!readOnly?'<button data-knowledge-review="'+esc(t.id)+'">Review</button>':'')+'</div></details>';
}

function show(person=''){
 const selected=data.learners.find(p=>p.person===person),people=data.learners.map(p=>({id:p.person,name:cleanName(p.name),role:p.role,group:p.group,state:p.counts['needs-support']?'attention':p.counts['needs-check']?'review':p.counts.demonstrated?'recorded':'empty',stateLabel:p.counts['needs-support']?'Task needs support':p.counts['needs-check']?'Task needs review':p.counts.demonstrated?'Task evidence saved':'No individual record'}));
 const groups=[...new Set(people.map(p=>p.group))].map(group=>({group,attention:people.filter(p=>p.group===group&&p.state==='attention').length,review:people.filter(p=>p.group===group&&p.state==='review').length,footer:''}));
 const panel=selected?'<aside class="knowledge-student classroom-inspect"><header><div><h2>'+esc(cleanName(selected.name))+'</h2><p>'+esc(selected.role)+'</p></div><button id="closeStudent" aria-label="Close student record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>'+selected.tasks.map(t=>knowledgeTaskHTML(t,true)).join('')+'</aside>':'';
 document.querySelector('#reportView').innerHTML=classroomLegend(true)+'<div class="classroom-space '+(selected?'with-inspector':'')+'">'+classroomMapHTML(people,groups,person,true)+panel+'</div>';
 document.querySelectorAll('[data-knowledge-person]').forEach(b=>b.onclick=()=>show(b.dataset.knowledgePerson));document.querySelectorAll('[data-progress-team]').forEach(b=>b.onclick=()=>{const p=data.learners.find(p=>p.group===+b.dataset.progressTeam&&p.counts['needs-support'])||data.learners.find(p=>p.group===+b.dataset.progressTeam);if(p)show(p.person)});
 document.querySelector('#closeStudent')?.addEventListener('click',()=>show());
 if(selected){const t=selected.tasks.find(t=>t.status==='needs-support')||selected.tasks.find(t=>t.review&&!t.reviewStale)||selected.tasks[0];if(t)document.querySelector('[data-knowledge-task="'+t.id+'"]').open=true}
}
const simulated=data.learners.some(p=>p.name.includes('(example)'));document.querySelector('#exampleLabel').textContent=simulated?'Example records':'Saved activity';document.querySelector('#printReport').onclick=()=>window.print();show();
</script></body></html>
