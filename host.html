<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CollabCanvas · InfoVis</title><link rel="stylesheet" href="/host.css"><link rel="stylesheet" href="/apple-host.css"><link rel="stylesheet" href="/tutorial.css"><link rel="stylesheet" href="/light-host.css"><link rel="stylesheet" href="/lifecycle.css"><link rel="stylesheet" href="/planner-widget.css"><link rel="stylesheet" href="/studio-host.css"><link rel="stylesheet" href="/progress-host.css"><link rel="stylesheet" href="/hands-on.css"><link rel="stylesheet" href="/adaptive.css"><link rel="stylesheet" href="/framework-ui.css"><link rel="stylesheet" href="/knowledge-report.css"><link rel="stylesheet" href="/monitor-dashboard.css"><link rel="stylesheet" href="/classroom-map.css"><link rel="stylesheet" href="/rules-host.css"></head><body>
<header class="topbar"><a class="brand" href="#" aria-label="CollabCanvas home"><span class="brand-mark"><i></i><i></i><i></i></span>CollabCanvas</a><span class="divider"></span><input id="activityTitle" aria-label="Activity title" value="InfoVis / Reading a visual story"><select id="methodPicker" class="method-picker" aria-label="Collaboration method"></select><span id="deploymentState" class="workspace-status" hidden></span><span id="saveState" class="save-state">Connecting</span><div class="top-actions"><button id="newActivity" class="quiet new-activity" hidden>New</button><button id="undo" class="icon-button" title="Undo plan change" aria-label="Undo plan change"></button><button id="openGuide" class="quiet">How to demo</button><button id="studentsButton" class="quiet">Students</button><button id="runButton" class="quiet"></button><button id="shareButton" class="primary"></button></div></header>
<div class="workspace"><nav class="rail" aria-label="Workspace tools"><button id="materialsButton" class="rail-button" title="Materials" aria-label="Materials"></button><button id="layoutButton" class="rail-button" title="Arrange windows" aria-label="Arrange windows"></button><button id="sampleButton" class="rail-button" title="Load example answers in previews" aria-label="Load example answers in previews"></button><button id="inspectorToggle" class="rail-button inspector-toggle" title="Edit activity" aria-label="Edit activity"></button><div class="rail-spacer"></div><button id="sourceButton" class="rail-button" title="Course slides" aria-label="Open course slides"></button></nav>
<section id="canvasArea" class="canvas-area" aria-label="Activity workspace"><div class="canvas-top"><div><span class="eyebrow">ACTIVITY WORKSPACE</span><h1 id="workspaceTitle">Read a visual. Compare readings.</h1></div><div class="preview-context"><span id="planSummary" class="canvas-summary"></span><select id="groupPreview" aria-label="Preview group"></select></div></div><div id="phaseBar" class="phase-bar" aria-label="Preview stage"></div><div id="canvasViewBar" class="canvas-view-bar" aria-label="Activity structure guide"></div><div id="emptyCanvas" class="empty-canvas" hidden><span class="empty-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="5"/><path d="M11 16h10M16 11v10"/></svg></span><h1>Start with a plan.</h1><p>Open Planner below to begin.</p><button id="restoreActivity" hidden>Restore previous activity</button></div><div id="world" class="world"><svg id="connections" class="connections" width="2600" height="1800" aria-hidden="true"></svg><div id="windows"></div></div><div id="annotationLayer" class="annotation-layer" aria-hidden="true"></div><div class="canvas-bottom"><div class="canvas-tools" role="toolbar" aria-label="Canvas navigation"><button id="selectTool" class="active" aria-label="Select and move cards" title="Select · V"></button><button id="handTool" aria-label="Pan canvas" title="Pan · H or hold Space"></button></div><div id="hint" class="canvas-hint">Drag cards · Space to pan · Double-click to use a page</div><div class="zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomValue" aria-label="Fit all windows">60%</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="fit" aria-label="Fit all windows" title="Fit all windows"></button></div></div><div id="tutorialDock" class="tutorial-dock" role="region" aria-label="Activity walkthrough"></div><div class="canvas-dock" aria-label="Activity authoring"><button id="planButton" class="plan-button" aria-expanded="false" aria-controls="window-plan">Planner</button><div id="commandBar" class="command-bar"><span id="commandIcon"></span><input id="commandInput" aria-label="Edit this activity" placeholder="Change this activity…"><button id="applyCommand" title="Apply supported command" aria-label="Apply command"></button></div></div></section>
<aside class="inspector"><div class="inspector-heading"><p id="inspectorTitle">Inspector</p><button id="closeInspector" class="inspector-close" aria-label="Close inspector"></button></div><div id="attributeTabs" class="attribute-tabs" role="tablist" aria-label="Five structural attributes"></div><div id="inspectorBody" class="inspector-body"></div><div class="inspector-footer"><span class="status-dot"></span><span id="connectionLabel">Live links on your Wi-Fi</span><button id="historyButton" class="text-button">Changes</button></div></aside></div>
<div id="overlay" class="overlay" hidden></div><div id="toast" class="toast" role="status"></div><script src="/orchestration.js"></script><script src="/lifecycle.js"></script><script src="/planner-widget.js"></script><script src="/host.js"></script><script src="/orchestration-ui.js"></script><script src="/tutorial-data.js"></script><script src="/walkthrough.js"></script><script src="/studio-host.js"></script><script src="/activity-test.js"></script><script src="/progress-host.js"></script><script src="/progress-rules.js"></script><script src="/adaptive-host.js"></script><script src="/framework-ui.js"></script><script src="/support-comparison.js"></script><script src="/collaboration-rules.js"></script><script src="/classroom-map.js"></script><script src="/monitor-dashboard.js"></script><script src="/rules-host.js"></script><script src="/knowledge-report.js"></script><script src="/hands-on.js"></script></body></html>
