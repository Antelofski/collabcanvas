app = "collabcanvas-demo"
primary_region = "iad"

[build]

[env]
  COLLABCANVAS_PUBLIC = "1"
  COLLABCANVAS_START_VIEW = "progress"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
